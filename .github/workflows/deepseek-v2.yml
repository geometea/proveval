name: DeepSeek v2 production experiment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What should this run do?
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - production
          - recovery-preflight
          - recovery

  schedule:
    - cron: '7 3 18 9 *'
      timezone: 'America/Los_Angeles'

permissions:
  contents: read
  # Needed only by the "recovery" mode's cross-run artifact download below
  # (actions/download-artifact@v4 with run-id + repository requires this to
  # read another completed run's artifact). The scheduled/production path
  # never needs it and is unaffected.
  actions: read

# Prevent two production workflows from running at the same time.
concurrency:
  group: proveval-v2-production
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # If a previous production run stopped partway through,
      # restore its result files so the repo's observation_id
      # resume logic can skip calls already completed.
      - name: Restore previous production state
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'production' }}
        uses: actions/cache/restore@v4
        with:
          path: results/controllability_v2/production
          key: proveval-v2-production-${{ github.run_id }}
          restore-keys: |
            proveval-v2-production-

      - name: Production preflight
        run: python3 run_controllability_v2.py preflight --concurrency 32

      - name: Run baseline
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'production' }}
        timeout-minutes: 60
        run: python3 run_controllability_v2.py baseline --production --concurrency 32

      - name: Run treatment
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'production' }}
        timeout-minutes: 270
        run: python3 run_controllability_v2.py treatment --production --concurrency 32

      - name: Analyze completed experiment
        if: ${{ success() && (github.event_name == 'schedule' || inputs.mode == 'production') }}
        run: python3 analyze_controllability_v2.py

      # Preserve state for an automatic resume if this run was incomplete.
      - name: Save resumable production state
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'production') }}
        uses: actions/cache/save@v4
        with:
          path: results/controllability_v2/production
          key: proveval-v2-production-${{ github.run_id }}

      # Also keep a normal downloadable copy of everything.
      - name: Upload results
        if: ${{ always() && (github.event_name == 'schedule' || inputs.mode == 'production') }}
        uses: actions/upload-artifact@v4
        with:
          name: proveval-v2-results-${{ github.run_id }}
          path: |
            results/controllability_v2/production/
            results/controllability_v2/analysis/
          if-no-files-found: warn
          retention-days: 30

      # -----------------------------------------------------------------
      # Wave 2 recovery (mode: recovery-preflight, mode: recovery). Recovers
      # the failed DeepSeek production run from GitHub Actions run
      # 35355521243: retains every Wave 1 observation that already has a
      # valid A/B answer, reruns only the ones that don't, adds the new
      # no-context/text_only condition, runs the 500-observation validation
      # sample, merges everything, verifies full completeness, and
      # re-analyzes. This never touches the scheduled/production steps
      # above, and never automatically reruns the entire original
      # experiment -- only the specific gaps recovery-preflight identifies.
      #
      # mode: recovery-preflight downloads the source artifact and runs
      # ONLY the preflight check, then stops -- it makes no model API calls
      # and cannot reach any paid-call step below (each of those is gated
      # on the exact string "recovery", which 'recovery-preflight' never
      # equals). Use it first to see the exact recovery plan before
      # spending anything; then rerun with mode: recovery to execute it.
      # -----------------------------------------------------------------

      # actions/download-artifact@v4 can fetch an artifact from a DIFFERENT
      # completed run in this same repository via run-id + repository +
      # github-token (requires the "actions: read" permission above) --
      # no third-party action needed for this same-repo cross-run download.
      - name: Download Wave 1 artifact (run 35355521243)
        if: ${{ inputs.mode == 'recovery' || inputs.mode == 'recovery-preflight' }}
        uses: actions/download-artifact@v4
        with:
          name: proveval-v2-results-35355521243
          run-id: 35355521243
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: wave1_artifact

      # Purely diagnostic (no API calls): actions/upload-artifact@v4 strips
      # the LEAST COMMON ANCESTOR of every path passed to a single upload.
      # The "Upload results" step above uploads BOTH
      # results/controllability_v2/production/ and
      # results/controllability_v2/analysis/, whose common ancestor is
      # results/controllability_v2/ -- so the artifact's own internal
      # layout is production/... and analysis/..., NOT
      # results/controllability_v2/production/.... This step prints the
      # actual downloaded layout so that never has to be re-guessed.
      - name: Show downloaded Wave 1 artifact contents
        if: ${{ inputs.mode == 'recovery' || inputs.mode == 'recovery-preflight' }}
        run: |
          echo "Downloaded Wave 1 artifact contents:"
          find wave1_artifact -maxdepth 5 -type f -print | sort

      # Resolves the one true Wave 1 source directory ONCE, from the actual
      # upload-artifact layout described above (production/, not
      # results/controllability_v2/production/), and fails loudly -- before
      # any API call -- unless BOTH required raw files are present there.
      # Every later step reads $WAVE1_RESULTS_DIR rather than re-deriving
      # or duplicating this path.
      - name: Resolve Wave 1 source directory
        if: ${{ inputs.mode == 'recovery' || inputs.mode == 'recovery-preflight' }}
        run: |
          WAVE1_RESULTS_DIR="wave1_artifact/production"
          if [ ! -f "$WAVE1_RESULTS_DIR/treatment_raw.jsonl" ] || [ ! -f "$WAVE1_RESULTS_DIR/baseline_raw.jsonl" ]; then
            echo "ERROR: expected both treatment_raw.jsonl and baseline_raw.jsonl under $WAVE1_RESULTS_DIR" >&2
            echo "but did not find them there. See the directory listing in the previous step" >&2
            echo "for the artifact's actual downloaded layout." >&2
            exit 1
          fi
          echo "Resolved Wave 1 source directory: $WAVE1_RESULTS_DIR"
          echo "WAVE1_RESULTS_DIR=$WAVE1_RESULTS_DIR" >> "$GITHUB_ENV"

      - name: Recovery preflight
        if: ${{ inputs.mode == 'recovery' || inputs.mode == 'recovery-preflight' }}
        run: |
          python3 run_controllability_v2.py recovery-preflight \
            --source-results "$WAVE1_RESULTS_DIR"

      # Everything below here is gated on the exact string "recovery" --
      # mode: recovery-preflight stops at the step above and never reaches
      # any of these (and therefore never makes an API call).

      - name: Restore previous recovery state
        if: ${{ inputs.mode == 'recovery' }}
        uses: actions/cache/restore@v4
        with:
          path: results/controllability_v2/wave2_recovery
          key: proveval-v2-wave2-recovery-${{ github.run_id }}
          restore-keys: |
            proveval-v2-wave2-recovery-

      - name: Run recovery (unresolved Wave 1 observations only)
        if: ${{ inputs.mode == 'recovery' }}
        timeout-minutes: 120
        run: |
          python3 run_controllability_v2.py recovery-run \
            --source-results "$WAVE1_RESULTS_DIR" \
            --concurrency 32

      # baseline_text_only writes under results/controllability_v2/wave2_recovery/
      # (not production/) specifically so the cache restore/save above and
      # below preserves its progress across an interrupted/resumed run.
      - name: Run new no-context/text_only baseline condition
        if: ${{ inputs.mode == 'recovery' }}
        timeout-minutes: 60
        run: python3 run_controllability_v2.py baseline-text-only --production --concurrency 32

      - name: Run validation sample (500 non-primary duplicate observations)
        if: ${{ inputs.mode == 'recovery' }}
        timeout-minutes: 60
        run: |
          python3 run_controllability_v2.py validation-run \
            --source-results "$WAVE1_RESULTS_DIR" \
            --concurrency 32

      - name: Validation diagnostics report
        if: ${{ inputs.mode == 'recovery' }}
        run: python3 run_controllability_v2.py validation-report

      # Merges Wave 1 + recovery, then HARD-FAILS (after writing every
      # output) unless the merged dataset and the new baseline_text_only
      # dataset are both fully complete -- this step's own exit code is
      # what stops the workflow from reaching "Analyze" below on an
      # incomplete recovery. Its outputs are never deleted on failure, so
      # the job can simply be rerun.
      - name: Merge Wave 1 + recovery results
        if: ${{ inputs.mode == 'recovery' }}
        run: |
          python3 run_controllability_v2.py merge \
            --source-results "$WAVE1_RESULTS_DIR" \
            --recovery-results results/controllability_v2/wave2_recovery/recovery_raw.jsonl

      - name: Analyze the merged Wave 2 dataset
        if: ${{ success() && inputs.mode == 'recovery' }}
        run: |
          python3 analyze_controllability_v2.py \
            --treatment-results-file results/controllability_v2/wave2_recovery/merged_treatment_raw.jsonl \
            --baseline-results-file results/controllability_v2/wave2_recovery/merged_baseline_raw.jsonl \
            --baseline-text-only-results-file results/controllability_v2/wave2_recovery/baseline_text_only_raw.jsonl

      - name: Save resumable recovery state
        if: ${{ always() && inputs.mode == 'recovery' }}
        uses: actions/cache/save@v4
        with:
          path: results/controllability_v2/wave2_recovery
          key: proveval-v2-wave2-recovery-${{ github.run_id }}

      - name: Upload Wave 2 recovery results
        if: ${{ always() && inputs.mode == 'recovery' }}
        uses: actions/upload-artifact@v4
        with:
          name: proveval-v2-wave2-recovery-results-${{ github.run_id }}
          path: |
            results/controllability_v2/wave2_recovery/
            results/controllability_v2/analysis/
          if-no-files-found: warn
          retention-days: 30
